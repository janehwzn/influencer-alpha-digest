name: Influencer Alpha Weekly

on:
  schedule:
    # Monday 03:30 UTC = Sunday 20:30 PDT (19:30 during PST)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days"
        default: "7"

jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS="${{ inputs.days }}"
          else
            DAYS=7
          fi
          DATE=$(date -u +%F)
          # NOTE: --skip-transcribe because YouTube blocks media downloads
          # from GitHub-hosted runners (bot check); the alpha is built from
          # titles + descriptions (roundup mode). Remove the flag if
          # downloads ever become possible again.
          python3 scripts/weekly.py --days "$DAYS" --date "$DATE" --model small --skip-transcribe
          echo "ALPHA_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Commit alpha and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alpha-*.md data/videos-*.json data/state.json
          git diff --cached --quiet || git commit -m "Weekly influencer alpha for ${{ env.ALPHA_DATE }}"
          git pull --rebase
          git push

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          MD="data/alpha-${{ env.ALPHA_DATE }}.md"
          HTML="data/alpha-${{ env.ALPHA_DATE }}.html"
          python3 scripts/send_email.py "$MD" --html "$HTML" \
            --recipients-file subscribers.txt \
            --subject "📈 Influencer Alpha 周报 ${{ env.ALPHA_DATE }}"

      - name: Upload alpha artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ env.ALPHA_DATE }}
          path: |
            data/alpha-*.md
            data/alpha-*.html
