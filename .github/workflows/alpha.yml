name: Influencer Alpha Weekly

on:
  schedule:
    # Monday 03:30 UTC = Sunday 20:30 PDT (19:30 during PST)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days"
        default: "7"

jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS="${{ inputs.days }}"
          else
            DAYS=7
          fi
          DATE=$(date -u +%F)
          # Transcripts: Groq Whisper API first (GROQ_API_KEY secret, free
          # tier), then Supadata (SUPADATA_API_KEY), then local fallback.
          # Audio is downloaded with yt-dlp so this works on GitHub runners.
          python3 scripts/weekly.py --days "$DAYS" --date "$DATE" --model small
          echo "ALPHA_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Commit alpha and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alpha-*.md data/videos-*.json data/state.json
          git diff --cached --quiet || git commit -m "Weekly influencer alpha for ${{ env.ALPHA_DATE }}"
          git pull --rebase
          git push

      # NOTE (2026-10-05): email sending was removed from this workflow.
      # The pipeline now only fetches + transcribes + archives. The weekly
      # newsletter email (deep analysis written by Muse's own model) is sent
      # by the Sunday deep-dive cron instead. Never re-add a heuristic-fallback
      # email send here: the user has explicitly rejected heuristic digests.

      - name: Upload alpha artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-${{ env.ALPHA_DATE }}
          path: |
            data/alpha-*.md
            data/alpha-*.html
